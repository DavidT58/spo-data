# nginx site for the SPO dashboard — plain-HTTP origin behind Cloudflare
# (SSL mode: Flexible; TLS terminates at the CF edge; enable "Always Use HTTPS"
# in the CF dashboard so browsers never see plain HTTP).
#
# Install: copy to /etc/nginx/sites-available/spo-dashboard, symlink into
# sites-enabled, create the htpasswd file (htpasswd -B -c /etc/nginx/.htpasswd
# <user>), generate the CF allowlist with deploy/cf-ips.sh, then
#   sudo nginx -t && sudo systemctl reload nginx
#
# Only Cloudflare may talk to this site: the allow/deny pair rejects direct-IP
# clients with 403. Enforced in nginx, not the host firewall — fr-0 is the BP
# subnet's NAT gateway and must not run a default-deny firewall. Deliberately
# NO realip module here: rewriting $remote_addr to the end-client IP would
# break the allow/deny check (allow evaluates $remote_addr). The end-client IP
# is still available in the CF-Connecting-IP header if ever needed in logs.
# The daemon itself listens on 127.0.0.1:8090.

server {
    listen 80;
    server_name dash.summitstak.ing;

    # Cloudflare-only access (generated by deploy/cf-ips.sh) + loopback for
    # on-host health checks.
    allow 127.0.0.1;
    include /etc/nginx/cloudflare-allow.conf;
    deny all;

    auth_basic "SPO Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
}
